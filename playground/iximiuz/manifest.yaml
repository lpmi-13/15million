kind: playground
name: 15-million-webservers-lab-bb24aaad
base: flexbox
title: Can One VM Host 15 Million Web Servers?
description: A bounded systems investigation of ports, processes, idle sockets, AnyIP, and a compact smoltcp runtime.
categories:
  - linux
  - networking
playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24
  machines:
    - name: dev-01
      users:
        - name: root
        - name: laborant
          default: true
          welcome: |
            Explore the lab under ~/15m-lab. Start with the C baseline and
            bounded probes. The 15-million-listener runtime is stopped at boot.
      drives:
        - source: oci://ghcr.io/lpmi-13/15million-rootfs:v4
          mount: /
          size: 20GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.2/24
      resources:
        cpuCount: 4
        ramSize: 10GiB
    - name: client-01
      users:
        - name: root
        - name: laborant
          default: true
          welcome: |
            Probe 10.0.0.0/8 through dev-01. The route stays inside this playground.
      drives:
        - source: oci://ghcr.io/lpmi-13/15million-rootfs:v4
          mount: /
          size: 10GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.3/24
      resources:
        cpuCount: 2
        ramSize: 2GiB
  tabs:
    - id: terminal-dev-01
      kind: terminal
      name: Server
      machine: dev-01
    - id: terminal-client-01
      kind: terminal
      name: Client
      machine: client-01
  initTasks:
    init_dev_01_ready:
      name: init_dev_01_ready
      machine: dev-01
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        #!/bin/bash
        /opt/15m-lab/tasks/wait_ready.sh server
    init_client_01_ready:
      name: init_client_01_ready
      machine: client-01
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        #!/bin/bash
        /opt/15m-lab/tasks/wait_ready.sh client
  accessControl:
    canList:
      - anyone
    canRead:
      - anyone
    canStart:
      - anyone
