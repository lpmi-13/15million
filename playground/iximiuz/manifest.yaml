kind: playground
name: 15-million-webservers-lab-bb24aaad
base: flexbox
title: Can One VM Host 15 Million Web Servers?
description: A bounded systems investigation of ports, processes, idle sockets, AnyIP, and a compact smoltcp runtime.
categories:
  - linux
  - networking
playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24
  machines:
    - name: dev-01
      users:
        - name: root
        - name: laborant
          default: true
          welcome: |
            Edit the starters in ~/15m-work. Start with the C baseline and
            bounded probes. The 15-million-listener runtime is stopped at boot.
      drives:
        - source: oci://ghcr.io/lpmi-13/15million-rootfs:v11
          mount: /
          size: 20GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.2/24
      resources:
        cpuCount: 4
        ramSize: 10GiB
  tabs:
    - id: terminal-dev-01
      kind: terminal
      name: Server
      machine: dev-01
  initTasks:
    init_dev_01_ready:
      name: init_dev_01_ready
      machine: dev-01
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        #!/bin/bash
        /opt/15m-lab/tasks/wait_ready.sh server
  accessControl:
    canList:
      - anyone
    canRead:
      - anyone
    canStart:
      - anyone
